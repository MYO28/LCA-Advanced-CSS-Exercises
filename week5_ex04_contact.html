<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopCo | Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="week5_ex04_index.html">ShopCo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="week5_ex04_index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="week5_ex04_products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="week5_ex04_about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="week5_ex04_contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="alert alert-primary alert-dismissible fade show mb-0 rounded-0" role="alert">
    📬 We typically respond within 24 hours on business days.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="bg-dark text-white text-center py-5">
    <h1 class="fw-bold">Contact Us</h1>
    <p class="lead mb-0">Send us a message and we'll get back to you</p>
  </div>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7" data-aos="fade-up">
        <div class="card shadow-sm p-4">
          <h4 class="fw-bold mb-4">Send Us a Message</h4>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" placeholder="John">
            </div>
            <div class="col-sm-6">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" placeholder="Doe">
            </div>
            <div class="col-12">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="john@example.com">
            </div>
            <div class="col-12">
              <label class="form-label">Subject</label>
              <select class="form-select">
                <option value="">Select a subject...</option>
                <option>Order Enquiry</option>
                <option>Product Question</option>
                <option>Returns & Refunds</option>
                <option>General Feedback</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="5" placeholder="Type your message here..."></textarea>
            </div>
            <div class="col-12">
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="subscribe">
                <label class="form-check-label" for="subscribe">Subscribe to our newsletter</label>
              </div>
              <button class="btn btn-dark w-100">Send Message</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 ShopCo. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
